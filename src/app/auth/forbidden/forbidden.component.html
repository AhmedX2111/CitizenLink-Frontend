<div *transloco="let t" class="h-screen bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center">
  <div class="w-full max-w-md px-4 text-center">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden p-8">
      <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-red-100 flex items-center justify-center">
        <svg class="w-10 h-10 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800 mb-2">{{ t('forbidden.title') }}</h1>
      <p class="text-gray-600 text-sm mb-6">{{ t('forbidden.message') }}</p>
      <a routerLink="/dashboard"
         class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white py-2 px-4 rounded-lg font-semibold transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/>
        </svg>
        {{ t('forbidden.backToDashboard') }}
      </a>
    </div>
  </div>
</div>
