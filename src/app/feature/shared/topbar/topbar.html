<header class="fixed top-0 ltr:left-64 rtl:right-64 ltr:right-0 rtl:left-0 h-16 bg-surface border-b border-outline-variant flex justify-between items-center px-6 z-40">
  <div class="flex items-center gap-2 text-sm text-on-surface-variant">
    <span class="material-symbols-outlined text-base">calendar_today</span>
    <span class="font-label-md">{{ today() }}</span>
  </div>
  <div class="flex items-center gap-6">
    <button (click)="toggleLanguage()"
            class="flex items-center gap-1 text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md">
      <span class="material-symbols-outlined">language</span>
      {{ isArabic() ? ('nav.switchToEnglish' | transloco) : ('nav.switchToArabic' | transloco) }}
    </button>
    <!-- <button class="text-on-surface-variant hover:text-primary transition-colors">
      <span class="material-symbols-outlined">notifications</span>
    </button>
    <button class="text-on-surface-variant hover:text-primary transition-colors">
      <span class="material-symbols-outlined">help</span>
    </button> -->
  </div>
</header>
