name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        # JUnit report is uploaded below; a failing test fails this check
        # (branch protection makes it required on master — US-48 AC5).
        run: npm test -- --watch=false --reporters=junit --output-file=ci-test-results/junit.xml

      - name: Production build
        run: npm run build:prod

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reports
          path: ci-test-results
          if-no-files-found: warn
          retention-days: 14
